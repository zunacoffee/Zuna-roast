[package]
name = "zuna-roast"
version = "1.0.27"
description = "Zuna Roast — roasting software for the Probat P12 III"
authors = ["Zuna Coffee"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "zuna_roast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# iPad only: folder picker for the iCloud roast folder, iCloud download, keep screen on, share sheet.
# Never part of the Mac build.
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-zuna-ios = { path = "plugins/zuna-ios" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
