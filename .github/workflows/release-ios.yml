# Builds the iPad app on GitHub's Macs.
#
# • Every push to the `ipad` branch: an unsigned build for the iPad simulator, just to prove
#   the iPad app still compiles. Nothing is uploaded.
# • Run by hand (Actions tab → "Release iPad app" → Run workflow): a signed build that is sent
#   to TestFlight, ready to install on the iPad.
# • Automatically on the 1st of every other month: the same signed build, so the iPad app never
#   reaches TestFlight's 90-day limit. (Scheduled runs only start once this file is on `main`.)
# Signed builds need these repository secrets:
#     APPLE_TEAM_ID       10-character Team ID   (developer.apple.com → Membership details)
#     APPLE_API_KEY_ID    App Store Connect API key ID
#     APPLE_API_ISSUER    App Store Connect issuer ID
#     APPLE_API_KEY_P8    full text of the AuthKey_XXXX.p8 file
#
# The Mac app is not touched by this workflow (that's "Release Mac app").
name: Release iPad app

on:
  push:
    branches: [ipad]
    paths:
      - 'app/**'
      - 'src-tauri/**'
      - 'package*.json'
      - '.github/workflows/release-ios.yml'
  schedule:
    - cron: '17 9 1 */2 *'   # 09:17 UTC on the 1st of Jan, Mar, May, Jul, Sep, Nov
  workflow_dispatch:
    inputs:
      upload:
        description: 'Send the build to TestFlight'
        type: boolean
        default: true

permissions:
  contents: read
  actions: write   # lets the scheduled run keep itself switched on

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      SIGNED: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.upload) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ios
      - run: npm ci
      - run: npm run check

      - name: Set up the Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          npx tauri ios init --ci
          npx tauri icon src-tauri/icons/ios-1024.png --ios-color '#114F68'

      - name: Check the signing secrets
        if: env.SIGNED == 'true'
        env:
          A: ${{ secrets.APPLE_TEAM_ID }}
          B: ${{ secrets.APPLE_API_KEY_ID }}
          C: ${{ secrets.APPLE_API_ISSUER }}
          D: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=""
          [ -n "$A" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$B" ] || missing="$missing APPLE_API_KEY_ID"
          [ -n "$C" ] || missing="$missing APPLE_API_ISSUER"
          [ -n "$D" ] || missing="$missing APPLE_API_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Compile check (iPad simulator, unsigned)
        if: env.SIGNED != 'true'
        run: npx tauri ios build --target aarch64-sim --debug --ci

      - name: Build for TestFlight (signed)
        if: env.SIGNED == 'true'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8
          printf '%s\n' "$P8" > "$KEY"
          export APPLE_API_KEY_PATH="$KEY"
          npx tauri ios build --export-method app-store-connect --build-number ${{ github.run_number }} --ci
          IPA=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          [ -n "$IPA" ] || { echo "::error::No .ipa was produced"; exit 1; }
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: Send to TestFlight
        if: env.SIGNED == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
          echo "### Sent to TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "Build ${{ github.run_number }} of version $(node -p "require('./package.json').version") — it shows up in the TestFlight app on the iPad after Apple finishes processing (usually 5–30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the automatic refresh switched on
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub pauses scheduled workflows in repos with no commits for 60 days; re-enabling keeps it going.
        run: gh workflow enable release-ios.yml -R "${{ github.repository }}" || true

      - name: Keep the build
        if: always() && env.IPA != ''
        uses: actions/upload-artifact@v4
        with:
          name: zuna-roast-ipad-${{ github.run_number }}
          path: ${{ env.IPA }}
          retention-days: 14
